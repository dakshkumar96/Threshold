# Settings for the Python tools. The project itself is not installed as a package:
# the API runs from the repo root with `uvicorn api.main:app`.

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["notebooks", "ats-scrapers", "frontend"]

[tool.ruff.lint]
# Errors, unused names, import order and likely bugs.
select = ["E4", "E7", "E9", "F", "I", "B"]
# FastAPI declares form fields and dependencies as default values on purpose.
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# Command-line scripts put src/ on the import path before importing from it.
"src/{fetch_greenhouse,run_survival,qa_dynamic_skills,qa_requirements_sample,qa_skill_recall}.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["api", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = [
    # FastAPI's TestClient still uses httpx, which Starlette now warns about.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
