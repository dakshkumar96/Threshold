# nginx reverse proxy for the Threshold API, if you use nginx instead of Caddy
# (production uses Caddy, see Caddyfile.example).
# Install: sudo cp deploy/nginx-threshold-api.conf /etc/nginx/sites-available/threshold-api
#          sudo ln -s /etc/nginx/sites-available/threshold-api /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN_OR_IP below with the server's public IP, or with a domain
# once one points at it. HTTPS needs a domain, because certbot cannot issue a
# certificate for a bare IP address.

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # A CV can be up to 5 MB. Anything much bigger is refused here.
    client_max_body_size 6m;

    # A search can take a few minutes (job boards, register matching and the
    # AI review). The website waits up to 210 s, so nginx must wait longer than
    # its default of 60 s.
    proxy_read_timeout 230s;
    proxy_send_timeout 230s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Only the address nginx saw, so a client cannot fake its address to
        # get around the API's per-address rate limits.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After DNS for your domain points at this server, run:
#   sudo certbot --nginx -d your-domain.com
# certbot then adds the HTTPS (443) server block and the redirect from 80 to 443.
