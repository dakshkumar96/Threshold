# nginx reverse proxy for the Threshold API.
# Install: sudo cp deploy/nginx-threshold-api.conf /etc/nginx/sites-available/threshold-api
#          sudo ln -s /etc/nginx/sites-available/threshold-api /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#
# Replace YOUR_DOMAIN_OR_IP below with your instance's public IP, or a domain name
# once you have one pointed at it (a domain is required for certbot/HTTPS — certbot
# cannot issue a certificate for a bare IP address).

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # /analyze can legitimately run long (live job fetch + fuzzy match against the
    # full sponsor register + optional LLM call). The frontend's own fetch timeout
    # is 210s (see api/main.py / README) — nginx's default 60s proxy_read_timeout
    # would otherwise kill a slow-but-healthy request before the app finishes.
    proxy_read_timeout 230s;
    proxy_send_timeout 230s;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After DNS for your domain points at this instance, run:
#   sudo certbot --nginx -d your-domain.com
# certbot rewrites this file in place to add the HTTPS (443) server block and a
# redirect from 80 to 443 — no manual edit needed for that part.
